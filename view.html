<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>레벨 밸런스</title>
<style>
/* 복호화 대기 화면. 성공하면 문서 전체가 원본 HTML 로 바뀐다. */
/* 목록 화면(index.html)과 같은 어두운 무대 색 */
:root{
  color-scheme:dark;
  --bg:#101119; --card:#1b1d29; --line:#2a2d3c; --ink:#f4f5fa; --ink-2:#b4b8c8; --ink-3:#80849a; --accent:#4f8ef7; --bad:#ff8a5c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;min-height:100%}
.box{max-width:380px;margin:18vh auto 0;padding:22px 22px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.title{font-weight:600;font-size:15px;margin-bottom:6px}
.msg{color:var(--ink-2);font-size:13px}
.msg.bad{color:var(--bad)}
form{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit}
button{padding:8px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer}
.home{display:inline-block;margin-top:14px;color:var(--ink-3);font-size:12px;text-decoration:none}
@media (max-width:420px){ .box{margin:12vh 16px 0} }
</style>
</head>
<body>
<main class="box">
  <div class="title" id="title">레벨 밸런스</div>
  <div class="msg" id="msg">여는 중…</div>
  <form id="form" hidden>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button type="submit">열기</button>
  </form>
  <a class="home" id="home" href="index.html">← 목록</a>
</main>
<script>
// 원본 HTML 을 document.write 로 이 문서에 그대로 쓴다. 전역 변수는 원본 스크립트와 공유되므로
// 이 스크립트는 전역에 아무것도 선언하지 않는다(IIFE 안에서만).
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var id = new URLSearchParams(location.search).get('f') || '';
  var m = /(?:^#|[#&])k=([^&]+)/.exec(location.hash);
  var home = 'index.html' + (location.hash || '');
  $('home').href = home;

  function store(v){ try { if (v == null) localStorage.removeItem('lb-pass'); else localStorage.setItem('lb-pass', v); } catch (e) {} }
  function saved(){ try { return localStorage.getItem('lb-pass'); } catch (e) { return null; } }
  function say(text, bad){ var e = $('msg'); e.textContent = text; e.className = 'msg' + (bad ? ' bad' : ''); }
  function load(src){
    return new Promise(function(ok, fail){
      var s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = function(){ fail(new Error('load')); };
      document.head.appendChild(s);
    });
  }
  function b64(s){ var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }

  async function decrypt(enc, pass){
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(enc.salt), iterations: enc.iter, hash: 'SHA-256'}, km,
      {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(enc.iv)}, key, b64(enc.ct));
    var stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }

  function show(html){
    delete window.LB_ENC; delete window.LB_CATALOG;
    // 원본이 자체 다크/라이트(data-theme)를 갖고 있으면 그걸 쓰고, 없으면 스타일시트 색만 밝기를 뒤집는다.
    var themable = /\[data-theme=["']?dark/.test(html);
    document.open(); document.write(html); document.close();
    addBar(themable);
  }

  function pref(v){
    try { if (v === undefined) return localStorage.getItem('lb-theme'); localStorage.setItem('lb-theme', v); } catch (e) { return null; }
  }

  // 지금 화면 배경이 어두운지(원본 기준). 배경이 투명하면 밝은 것으로 본다.
  function looksDark(){
    var bg = [document.body, document.documentElement].map(function(e){ return getComputedStyle(e).backgroundColor; })
      .filter(function(c){ return c && !/rgba\(.*,\s*0\)$|transparent/.test(c); })[0];
    var v = bg && bg.match(/[\d.]+/g);
    if (!v) return false;
    return (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255 < 0.45;
  }

  // ── 밝기 뒤집기 ──
  // 원본 스타일시트의 색 값만 골라 색상·채도는 두고 밝기만 뒤집은 덮어쓰기 시트를 만든다.
  // 이미지와 인라인 style 색(레벨 색 견본 등)은 건드리지 않으므로 레벨 그림 색이 그대로 남는다.
  var COLOR_RE = /#(?:[0-9a-f]{8}|[0-9a-f]{6}|[0-9a-f]{3,4})\b|rgba?\([^)]*\)|hsla?\([^)]*\)|\b(?:white|black)\b/gi;
  var SKIP = /shadow/;   // 그림자는 어두운 채로 둔다(뒤집으면 빛 번짐이 된다)

  function parseColor(c){
    c = c.toLowerCase();
    if (c === 'white') return [255, 255, 255, 1];
    if (c === 'black') return [0, 0, 0, 1];
    if (c[0] === '#') {
      var h = c.slice(1);
      if (h.length <= 4) h = h.split('').map(function(x){ return x + x; }).join('');
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
    }
    var n = (c.match(/[\d.]+%?/g) || []).map(function(x, i){ return x.slice(-1) === '%' ? parseFloat(x) / 100 * (i < 3 && c[0] === 'r' ? 255 : 1) : parseFloat(x); });
    if (n.length < 3) return null;
    if (c[0] === 'h') { var rgb = hslToRgb(n[0] / 360, n[1] > 1 ? n[1] / 100 : n[1], n[2] > 1 ? n[2] / 100 : n[2]); n = rgb.concat(n.slice(3)); }
    return [n[0], n[1], n[2], n.length > 3 ? n[3] : 1];
  }
  function hslToRgb(h, s, l){
    var q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    return [h + 1 / 3, h, h - 1 / 3].map(function(t){
      t = (t + 1) % 1;
      var v = t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p;
      return Math.round(v * 255);
    });
  }
  function flip(c){
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0;
    if (d) {
      s = d / (1 - Math.abs(2 * l - 1));
      h = (mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) / 6;
    }
    var rgb = hslToRgb(h, s, 0.07 + 0.9 * (1 - l));   // 흰색 → 아주 어두운 회색, 검정 → 거의 흰색
    return 'rgba(' + rgb.join(',') + ',' + c[3] + ')';
  }
  function flipValue(v){
    return v.replace(COLOR_RE, function(m, at, s){
      if (s.slice(Math.max(0, at - 4), at) === 'url(') return m;   // url(#id) 참조는 색이 아니다
      var c = parseColor(m); return c ? flip(c) : m;
    });
  }

  function flippedCss(){
    var out = [':root{color-scheme:dark}'];
    function walk(rules){
      for (var i = 0; i < rules.length; i++) {
        var r = rules[i];
        if (r.style && r.selectorText) {
          var decl = [];
          for (var j = 0; j < r.style.length; j++) {
            var p = r.style[j];
            if (SKIP.test(p)) continue;
            var v = r.style.getPropertyValue(p);
            if (!COLOR_RE.test(v)) { COLOR_RE.lastIndex = 0; continue; }
            COLOR_RE.lastIndex = 0;
            decl.push(p + ':' + flipValue(v) + (r.style.getPropertyPriority(p) ? ' !important' : ''));
          }
          if (decl.length) out.push(r.selectorText + '{' + decl.join(';') + '}');
        } else if (r.cssRules && r.media) {
          out.push('@media ' + r.media.mediaText + '{'); walk(r.cssRules); out.push('}');
        } else if (r.cssRules && r.conditionText) {
          out.push('@supports ' + r.conditionText + '{'); walk(r.cssRules); out.push('}');
        }
      }
    }
    for (var k = 0; k < document.styleSheets.length; k++) {
      var sh = document.styleSheets[k];
      if (sh.ownerNode && sh.ownerNode.id === 'lb-flip') continue;
      try { walk(sh.cssRules); } catch (e) { /* 외부 글꼴 시트 등은 읽을 수 없다 — 색이 없으니 건너뛴다 */ }
    }
    // 배경·글자색을 정하지 않은 페이지는 브라우저 기본(흰 바탕·검은 글자)을 뒤집어 둔다.
    var clear = /rgba\(0,\s*0,\s*0,\s*0\)|transparent/;
    if (clear.test(getComputedStyle(document.documentElement).backgroundColor) && clear.test(getComputedStyle(document.body).backgroundColor)) {
      out.unshift('html{background-color:' + flip([255, 255, 255, 1]) + '}');
    }
    out.unshift('html{color:' + flip(parseColor(getComputedStyle(document.body).color) || [0, 0, 0, 1]) + '}');
    return out.join('\n');
  }

  // 원본 페이지 위에 "← 목록" 과 테마 버튼을 띄운다. 원본 CSS 에 휘둘리지 않게 인라인 스타일만 쓴다.
  function addBar(themable){
    if (!document.body) return document.addEventListener('DOMContentLoaded', function(){ addBar(themable); });
    var root = document.documentElement;
    var font = 'font:500 13px/1 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;';
    var pill = 'display:inline-flex;align-items:center;padding:9px 14px;border-radius:999px;cursor:pointer;text-decoration:none;' +
      'box-shadow:0 2px 10px rgba(0,0,0,.3);' + font;
    var flipSheet = null;
    function setFlipped(on){
      if (on && !flipSheet) {
        flipSheet = document.createElement('style');
        flipSheet.id = 'lb-flip';
        flipSheet.textContent = flippedCss();
        document.head.appendChild(flipSheet);
      }
      if (flipSheet) flipSheet.disabled = !on;
    }

    var bar = document.createElement('div');
    bar.id = 'lb-bar';
    bar.setAttribute('style', 'position:fixed;left:16px;bottom:16px;z-index:2147483647;display:flex;gap:8px');
    var a = document.createElement('a');
    a.href = home;
    a.textContent = '← 목록';
    a.setAttribute('style', pill + 'background:#2a78d6;color:#fff;border:1px solid rgba(255,255,255,.45)');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('style', pill + 'background:#fff;color:#171a20;border:1px solid rgba(23,26,32,.18)');
    bar.appendChild(a); bar.appendChild(btn);
    document.body.appendChild(bar);

    var native = looksDark() ? 'dark' : 'light';
    var current = native;
    function apply(mode){
      current = mode;
      if (themable) root.setAttribute('data-theme', mode);
      else setFlipped(mode !== native);
      btn.textContent = mode === 'dark' ? '라이트로 보기' : '다크로 보기';
    }
    var saved = pref();
    if (saved === 'dark' || saved === 'light') apply(saved); else btn.textContent = native === 'dark' ? '라이트로 보기' : '다크로 보기';
    btn.addEventListener('click', function(){ var next = current === 'dark' ? 'light' : 'dark'; apply(next); pref(next); });
  }

  async function tryOpen(enc, pass, fromLink){
    say('여는 중…');
    var html;
    try { html = await decrypt(enc, pass); }
    catch (e) {
      if (!fromLink) store(null);
      say(fromLink ? '링크의 비밀번호가 맞지 않습니다.' : '비밀번호가 맞지 않습니다.', true);
      $('form').hidden = false; $('pw').focus();
      return;
    }
    store(pass);
    show(html);
  }

  async function main(){
    if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
      return say('이 브라우저에서는 열 수 없습니다. 최신 Chrome · Safari · Edge 로 열어 주세요.', true);
    }
    try { await load('catalog.js?t=' + Date.now()); } catch (e) { return say('목록을 불러오지 못했습니다.', true); }
    var doc = null;
    ((window.LB_CATALOG || {}).games || []).forEach(function(g){
      g.files.forEach(function(f){ if (f.id === id) doc = {game: g.name, title: f.title, ver: f.ver}; });
    });
    if (!doc) return say('없는 문서입니다. 목록에서 다시 골라 주세요.', true);
    $('title').textContent = doc.game + ' · ' + doc.title;
    document.title = doc.game + ' · ' + doc.title;

    say('내려받는 중…');
    try { await load('data/' + encodeURIComponent(id) + '.enc.js?v=' + doc.ver); } catch (e) { return say('문서를 내려받지 못했습니다.', true); }
    var enc = window.LB_ENC;

    $('form').addEventListener('submit', function(ev){
      ev.preventDefault();
      var v = $('pw').value.trim();
      if (v) tryOpen(enc, v, false);
    });
    var pass = m ? decodeURIComponent(m[1]) : saved();
    if (pass) return tryOpen(enc, pass, !!m);
    say('비밀번호를 입력해 주세요.');
    $('form').hidden = false; $('pw').focus();
  }
  main();
})();
</script>
</body>
</html>
